<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GTD Admin</title>
<link rel="icon" href="/brand/icon-64.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row .input { flex: 1; min-width: 200px; }
  .pad { padding: 20px; margin-top: 20px; }
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/"><img src="/brand/niblekins-mark-256.jpg" width="32" height="32" alt=""><span>GTD admin</span></a></header>
<main>
  <section class="card pad">
    <label for="key" class="small" style="display:block;font-weight:500;margin-bottom:6px">Admin key</label>
    <form class="row" id="f"><input id="key" class="input" type="password" autocomplete="current-password"><button class="btn btn-primary">Load</button></form>
    <p class="err" id="err"></p>
  </section>
  <section class="card pad" id="out" hidden>
    <div class="section-head"><h2 id="total"></h2><a class="btn btn-primary btn-sm" id="csv">Download CSV</a></div>
    <div class="scroll"><table id="per"></table></div>
    <h2 style="margin:24px 0 8px">Claims, newest first</h2>
    <div class="scroll"><table id="claims"></table></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
try { $("#key").value = sessionStorage.getItem("k") || ""; } catch {}
$("#f").onsubmit = async (e) => {
  e.preventDefault();
  const k = $("#key").value;
  $("#err").textContent = "";
  const r = await fetch("/api/admin", { headers: { "x-admin-key": k } });
  const j = await r.json();
  if (!r.ok) return void ($("#err").textContent = j.message);
  try { sessionStorage.setItem("k", k); } catch {}
  $("#out").hidden = false;
  $("#total").textContent = `${j.claims.length} claims`;
  $("#csv").href = "/api/admin?format=csv&key=" + encodeURIComponent(k);
  $("#per").innerHTML = "<tr><th>Collection</th><th>Holders in snapshot</th><th>Claimed</th></tr>" +
    j.collections.map((c) => `<tr><td>${esc(c.name)}</td><td>${c.holders}</td><td>${c.claimed}</td></tr>`).join("");
  $("#claims").innerHTML = "<tr><th>Claim wallet</th><th>Collection</th><th>Holding wallet</th><th>X</th><th>When</th><th></th></tr>" +
    j.claims.slice().reverse().map((c) => `<tr><td class="mono">${esc(c.claimWallet)}</td><td>${esc(c.collection)}</td><td class="mono">${esc(c.holderWallet)}</td><td><a href="https://x.com/${esc(c.x)}" target="_blank" rel="noopener">@${esc(c.x)}</a></td><td>${esc(new Date(c.at).toLocaleString())}</td><td><button class="btn btn-ghost" data-c="${esc(c.collection)}" data-h="${esc(c.holderWallet)}">Remove</button></td></tr>`).join("");
  for (const b of document.querySelectorAll("button[data-h]")) {
    b.onclick = async () => {
      if (!confirm(`Remove the claim from ${b.dataset.h}? Its wallets and X account can then claim again.`)) return;
      const r = await fetch("/api/admin", { method: "POST", headers: { "x-admin-key": k, "content-type": "application/json" }, body: JSON.stringify({ action: "remove", collection: b.dataset.c, holderWallet: b.dataset.h }) });
      if (!r.ok) return alert((await r.json()).message);
      $("#f").requestSubmit();
    };
  }
};
</script>
</body>
</html>
